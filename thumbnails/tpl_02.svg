<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
      <defs>
      <pattern id="tg2" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E4DFD2" stroke-width="1"/>
      </pattern>
      <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#88D445" stop-opacity="0.20"/>
        <stop offset="100%" stop-color="#0E1116" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#F0592A" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#0E1116" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#0E1116" stop-opacity="0"/>
      </radialGradient>
    </defs>
      <rect width="1280" height="720" fill="#F7F5EF"/>
      <rect width="1280" height="720" fill="url(#tg2)"/>
      <!-- Left clean empty headline zone on archival paper: x=64..760, y=72..640 -->
      <rect x="56" y="64" width="18" height="592" rx="9" fill="#E5484D"/>
      <g id="editable-headline-zone" data-bounds="96,84,660,552">
        <!-- Drop high-contrast #0E1116 / #E5484D headline here -->
      </g>
      <!-- Right visual card: falling curve + red gate cross -->
      <g transform="translate(804, 80)">
        <rect x="0" y="0" width="412" height="528" rx="28" fill="#0E1116" stroke="#E5484D" stroke-width="5"/>
        <polyline points="48,150 140,168 228,260 356,370" fill="none" stroke="#E5484D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="356" cy="370" r="16" fill="#E5484D"/>
        <line x1="44" y1="230" x2="368" y2="230" stroke="#F7F5EF" stroke-width="3" stroke-dasharray="10 10" opacity="0.45"/>
        <!-- Giant crisp X stamp badge (pure icon, no text) -->
        <g transform="translate(206, 415) rotate(-8)">
          <rect x="-86" y="-54" width="172" height="108" rx="20" fill="#1A1115" stroke="#E5484D" stroke-width="5"/>
          <path d="M -26 -24 L 26 24 M 26 -24 L -26 24" stroke="#E5484D" stroke-width="12" stroke-linecap="round"/>
        </g>
      </g>
    </svg>